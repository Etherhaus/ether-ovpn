<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#3127A8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B6B"/>
      <stop offset="1" stop-color="#3B3FC4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#110D4A" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <g filter="url(#shadow)">
    <!-- Shield -->
    <path d="M256 92 L392 140 V250 C392 336 336 394 256 424 C176 394 120 336 120 250 V140 Z" fill="#FFFFFF"/>
    <!-- Tunnel -->
    <path d="M190 350 V268 A66 66 0 0 1 322 268 V350 Z" fill="url(#tunnel)"/>
    <!-- Light at the end of the tunnel -->
    <circle cx="256" cy="282" r="18" fill="#4ADE80"/>
  </g>
</svg>
