# Runs on every push to main and every pull request, so a broken build, a
# formatting slip or a new warning is caught long before a release tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          # The Slint renderer links against fontconfig.
          sudo apt-get install -y libfontconfig1-dev
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
