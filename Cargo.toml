[package]
name = "ether-ovpn"
version = "0.3.1"
edition = "2024"
description = "A desktop client for OpenVPN profiles on Linux"
license = "MIT"
repository = "https://github.com/Etherhaus/ether-ovpn"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
dirs = "7.0.0"
flate2 = "1.1.10"
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking"] }
minisign-verify = "0.3.0"
resvg = "0.49.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = "1.18.1"
tar = "0.4.46"
ureq = "3.5.0"
zbus = { version = "5", features = ["blocking"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
